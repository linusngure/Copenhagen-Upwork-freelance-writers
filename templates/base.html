<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{% endblock %} — Copenhagen Online Writing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <ul>
        <li><a href="{{ url_for('profile') }}">Profile</a></li>
        <li><a href="{{ url_for('orders') }}">Orders</a></li>
        <li><a href="{{ url_for('submissions') }}">Submissions</a></li>
        <li><a href="{{ url_for('payouts') }}">Payouts</a></li>
        <li><a href="{{ url_for('messages') }}">Messages</a></li>
        <li><a href="{{ url_for('logout') }}">Logout</a></li>
      </ul>
    </aside>

    <!-- Main content -->
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
