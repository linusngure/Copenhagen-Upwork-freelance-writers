<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password — Copenhagen Online Writing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <header class="nav">
    <div class="container nav__inner">
      <div class="logo">Copenhagen Online Writing</div>
      <nav class="menu">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('faq') }}">FAQs</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Join</a>
      </nav>
    </div>
  </header>

  <!-- Forgot password form -->
  <div class="container auth">
    <h1>Reset your password</h1>
    <form class="form" id="forgotForm" method="POST" action="{{ url_for('forgot_password') }}">
      <label>Email</label>
      <input type="email" name="email" required />
      <button class="btn btn--primary" type="submit">Send reset link</button>
    </form>
    <p class="muted"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
