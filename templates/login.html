<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Copenhagen Online Writing</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <header class="nav">
    <div class="container nav__inner">
      <div class="logo">Copenhagen Online Writing</div>
      <nav class="menu">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('faq') }}">FAQs</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Join</a>
      </nav>
    </div>
  </header>

  <!-- Login form -->
  <div class="container auth">
    <h1>Log in</h1>
    <form class="form" id="loginForm" method="POST" action="{{ url_for('login') }}">
      <label>Email</label>
      <input type="email" name="email" required />

      <label>Password</label>
      <input type="password" name="password" required />

      <button class="btn btn--primary" type="submit">Log in</button>
    </form>

    <p class="muted">No account? <a href="{{ url_for('register') }}">Register</a></p>
    <p class="muted"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
    <p class="muted back-home"><a href="{{ url_for('home') }}">← Back to Home</a></p>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
